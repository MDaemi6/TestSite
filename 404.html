<body><main><h1>۴۰۴</h1><p>صفحه‌ای که دنبالش بودید پیدا نشد.</p><a id="home" href="/">بازگشت به صفحه اصلی</a></main>
<script>
(function(){var h=location.hostname,p=location.pathname.split('/')[1];
document.getElementById('home').href=(/\.github\.io$/.test(h)&&p)?'/'+p+'/':'/';})();
